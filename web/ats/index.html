<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/png" href="/src/assets/coploy_logo.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Coploy</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
			rel="stylesheet"
		/>
		<script>
			// Anti-FOUC: light é o default do produto (ADR design-fundacao §3);
			// dark só se o usuário escolheu antes.
			try {
				if (localStorage.getItem('coploy.ats.theme') === 'dark') {
					document.documentElement.classList.add('dark')
				}
			} catch {}
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
